name: warehouse
description: A warehouse floor app - move orders through the shop's fulfilment stages, and scan or count stock.
publish_to: 'none'
version: 1.3.0+14

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  blue_thermal_printer: ^1.2.3
  flutter:
    sdk: flutter
  flutter_local_notifications: ^18.0.1
  flutter_localizations:
    sdk: flutter
  geolocator: ^13.0.2
  http: ^1.2.2
  image_picker: ^1.1.2
  printing: ^5.15.0
  provider: ^6.1.2
  qr: ^3.0.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/logo.png

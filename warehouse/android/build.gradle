allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
// `blue_thermal_printer` (and other plugins of its vintage) predate AGP 8, which
// made `namespace` compulsory: without this the build fails with "Namespace not
// specified" while configuring that project. Falling back to the plugin's group
// is what AGP's own upgrade assistant does, and it is the same fix the till app
// (Yeaksaundry) has been shipping with for months.
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (namespace == null) {
                    namespace project.group.toString()
                }
                // Same vintage problem: the plugin targets android-31, while its
                // own androidx dependencies now require 34+. Pinned to the app's
                // own compileSdk so there is one number to change, not two.
                compileSdk = 36
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
